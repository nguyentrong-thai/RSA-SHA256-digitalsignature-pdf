<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hệ thống Ký số PDF{% endblock %}</title>
    <style>
        :root {
            --red:    #CC0000;
            --red-lt: #FF6666;
            --red-bg: #fff5f5;
            --green:  #1a7a1a;
            --green-bg:#f0fff0;
            --gray:   #4a4a4a;
            --border: #ddd;
            --bg:     #f8f8f8;
            --white:  #ffffff;
            --shadow: 0 2px 12px rgba(0,0,0,0.10);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--gray);
            min-height: 100vh;
        }

        /* ── NAV ─────────────────────────────────────────────── */
        nav {
            background: var(--red);
            padding: 0 40px;
            display: flex;
            align-items: center;
            gap: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        nav .brand {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 18px 0;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        nav a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 18px 4px;
            font-size: 0.95rem;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        nav a:hover, nav a.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        /* ── MAIN ─────────────────────────────────────────────── */
        main {
            max-width: 820px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--red);
            margin-bottom: 6px;
        }
        .subtitle {
            color: #888;
            font-size: 0.92rem;
            margin-bottom: 28px;
        }

        /* ── CARD ─────────────────────────────────────────────── */
        .card {
            background: var(--white);
            border-radius: 10px;
            padding: 32px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }
        .card h2 {
            font-size: 1.05rem;
            color: var(--red);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        /* ── FORM ─────────────────────────────────────────────── */
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }
        label span.req { color: var(--red); }

        input[type=text], input[type=password], input[type=number],
        select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border 0.2s;
            background: #fdfdfd;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--red);
            background: #fff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* ── FILE UPLOAD ─────────────────────────────────────── */
        .file-drop {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 22px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
            position: relative;
        }
        .file-drop:hover, .file-drop.dragover {
            border-color: var(--red);
            background: var(--red-bg);
        }
        .file-drop input[type=file] {
            position: absolute; inset: 0;
            opacity: 0; cursor: pointer;
            width: 100%; height: 100%;
        }
        .file-drop .icon { font-size: 2rem; margin-bottom: 6px; }
        .file-drop .label { font-size: 0.88rem; color: #888; }
        .file-drop .chosen { font-size: 0.88rem; color: var(--red); font-weight: 600; margin-top: 4px; }

        /* ── BUTTONS ─────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 28px;
            border: none;
            border-radius: 6px;
            font-size: 0.97rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--red);
            color: #fff;
        }
        .btn-primary:hover { background: #a00000; }
        .btn-secondary {
            background: #eee;
            color: var(--gray);
        }
        .btn-secondary:hover { background: #ddd; }
        .btn-green {
            background: var(--green);
            color: #fff;
        }
        .btn-green:hover { background: #155a15; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── ALERT ─────────────────────────────────────────────  */
        .alert {
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 0.93rem;
            display: none;
        }
        .alert.show { display: block; }
        .alert-success { background: var(--green-bg); border: 1px solid #a0d8a0; color: #155a15; }
        .alert-error   { background: var(--red-bg);   border: 1px solid #ffb3b3; color: #8b0000; }
        .alert-info    { background: #f0f4ff;          border: 1px solid #b3c6ff; color: #1a3a8f; }

        /* ── SPINNER ─────────────────────────────────────────── */
        .spinner {
            display: none;
            width: 22px; height: 22px;
            border: 3px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── RESULT BOX ─────────────────────────────────────── */
        .result-box {
            background: #f9f9f9;
            border-left: 4px solid var(--red);
            padding: 16px 20px;
            border-radius: 0 8px 8px 0;
            font-family: monospace;
            font-size: 0.88rem;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }
        .result-box.show { display: block; }
        .result-box.valid-sig { border-left-color: var(--green); background: var(--green-bg); }
        .result-box.invalid-sig { border-left-color: var(--red); background: var(--red-bg); }

        /* ── TOGGLE SWITCH ────────────────────────────────────  */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .toggle {
            position: relative;
            width: 44px; height: 24px;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; inset: 0;
            background: #ccc;
            border-radius: 24px;
            cursor: pointer;
            transition: 0.2s;
        }
        .slider:before {
            content: "";
            position: absolute;
            width: 18px; height: 18px;
            left: 3px; top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        input:checked + .slider { background: var(--red); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* ── STEP BADGE ──────────────────────────────────────── */
        .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px; height: 28px;
            background: var(--red);
            color: #fff;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: 700;
            margin-right: 8px;
            flex-shrink: 0;
        }

        /* ── HOME CARDS ────────────────────────────────────── */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 8px;
        }
        .home-card {
            background: var(--white);
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: var(--shadow);
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s, box-shadow 0.15s;
            border-top: 4px solid var(--red);
        }
        .home-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.13);
        }
        .home-card .icon { font-size: 2.6rem; margin-bottom: 12px; }
        .home-card h3 { font-size: 1rem; color: var(--red); margin-bottom: 8px; }
        .home-card p  { font-size: 0.85rem; color: #888; line-height: 1.5; }

        /* ── TECH BADGE ──────────────────────────────────────── */
        .tech-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .badge {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid #ffcccc;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .home-grid { grid-template-columns: 1fr; }
            .form-row  { grid-template-columns: 1fr; }
            nav { padding: 0 16px; gap: 16px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">🔏 PDF Ký số</a>
        <a href="/keygen" {% if request.endpoint == 'keygen' %}class="active"{% endif %}>Tạo chứng thư</a>
        <a href="/sign"   {% if request.endpoint == 'sign'   %}class="active"{% endif %}>Ký PDF</a>
        <a href="/verify" {% if request.endpoint == 'verify' %}class="active"{% endif %}>Xác thực</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
